group=com.netonstream.app
version=1.0.0

kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.native.ignoreDisabledTargets=true
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=4g

# 独立构建时把 netonstream 协议栈(io/http/tls/websocket)与 openssl 走兄弟目录源码替换，
# 与 neton 仓的默认口径一致；否则 com.netonstream:openssl:4.0.2-3 之类未发布坐标无法解析。
netonstream.local=true
netonstream.local.openssl=true
